name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No install step: the suite has no dependencies and the plugin ships
      # no package.json, by design. See the header of tests/run.js.
      - run: node tests/run.js
